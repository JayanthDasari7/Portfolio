# Runs Trivy + OWASP Dependency-Check + SonarQube on every push, then publishes the JSON reports
# to the "security-reports" branch so the dashboard can read them. Everything here is free.
# Tip: pin each third-party action to a commit SHA once it works.
name: DevSecOps scan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:community
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -fs http://localhost:9000/api/system/status | grep -q UP"
          --health-interval 15s --health-timeout 10s --health-retries 30
    env:
      OUT: reports-out
      SONAR_URL: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: mkdir -p $OUT

      - name: Trivy (dependencies, secrets, misconfig)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: reports-out/trivy.json
          exit-code: '0'

      - name: OWASP Dependency-Check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ github.event.repository.name }}
          path: .
          format: JSON
          out: reports-out
          args: --nvdApiKey ${{ secrets.NVD_API_KEY }}   # free key: https://nvd.nist.gov/developers/request-an-api-key
      - run: |
          sudo chown -R "$(id -u):$(id -g)" $OUT
          [ -f $OUT/dependency-check-report.json ] && mv $OUT/dependency-check-report.json $OUT/dependency-check.json || true

      - name: SonarQube analysis (self-hosted Community Edition in the job)
        continue-on-error: true
        run: |
          KEY="${{ github.event.repository.name }}"
          TOKEN=$(curl -s -u admin:admin -X POST "$SONAR_URL/api/user_tokens/generate?name=ci-$GITHUB_RUN_ID" | jq -r .token)
          echo "SONAR_TOKEN=$TOKEN" >> $GITHUB_ENV; echo "SONAR_KEY=$KEY" >> $GITHUB_ENV
      - uses: sonarsource/sonarqube-scan-action@v5
        continue-on-error: true
        env:
          SONAR_HOST_URL: http://localhost:9000
        with:
          args: -Dsonar.projectKey=${{ github.event.repository.name }} -Dsonar.sources=.
      - name: Export SonarQube results
        continue-on-error: true
        run: |
          CE=$(grep ceTaskId .scannerwork/report-task.txt | cut -d= -f2)
          for i in $(seq 1 40); do
            S=$(curl -s -u "$SONAR_TOKEN:" "$SONAR_URL/api/ce/task?id=$CE" | jq -r .task.status); [ "$S" = SUCCESS ] && break; sleep 5
          done
          curl -s -u "$SONAR_TOKEN:" "$SONAR_URL/api/issues/search?componentKeys=$SONAR_KEY&types=VULNERABILITY,BUG,CODE_SMELL&statuses=OPEN,CONFIRMED,REOPENED&ps=500" > issues.json
          curl -s -u "$SONAR_TOKEN:" "$SONAR_URL/api/measures/component?component=$SONAR_KEY&metricKeys=ncloc,coverage,duplicated_lines_density,bugs,vulnerabilities,code_smells" > measures.json
          jq -s '{total:.[0].total, issues:.[0].issues, measures:(.[1].component.measures // [])}' issues.json measures.json > $OUT/sonarqube.json

      - name: Write scan metadata
        run: |
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" \
            --arg actor "$GITHUB_ACTOR" --arg msg "$(git log -1 --pretty=%s)" --arg ts "$(date -u +%FT%TZ)" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{repo:$repo,sha:$sha,branch:$branch,actor:$actor,message:$msg,timestamp:$ts,runUrl:$run}' > $OUT/meta.json

      - name: Publish reports to security-reports branch
        if: github.event_name != 'pull_request'
        run: |
          ID="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}"
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch security-reports "$URL" pub 2>/dev/null || { git init -q -b security-reports pub; git -C pub remote add origin "$URL"; }
          mkdir -p "pub/reports/$ID" && cp $OUT/*.json "pub/reports/$ID/"
          cd pub && git config user.name devsecops-bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm "scan $ID" && git push -q origin security-reports
